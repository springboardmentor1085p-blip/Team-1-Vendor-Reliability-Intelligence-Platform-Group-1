version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vendoriq_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vendoriq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vendoriq_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vendoriq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vendoriq_user} -d ${POSTGRES_DB:-vendoriq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendoriq_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vendoriq_user}:${POSTGRES_PASSWORD:-vendoriq_secure_pass_2026}@db:5432/${POSTGRES_DB:-vendoriq_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeythatisextremelysecureandlongenoughfor2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ENV_MODE: ${ENV_MODE:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendoriq_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
